# Example configuration for the Re-ID batch container.
# Copy this file, edit it, and mount it into the container:
#   cp config/reid.example.toml /etc/reid/reid.toml && $EDITOR /etc/reid/reid.toml
#
# Secrets: the Immich API key may be left out of the file entirely and
# supplied via the IMMICH_API_KEY environment variable instead.

[immich]
# Base URL of the Immich server, without a trailing slash.
base_url = "http://immich-server:2283"

# A READ-SCOPED API key: create one in Immich under Account Settings → API Keys
# with only asset.read enabled. The pipeline reads asset metadata and pixels;
# it writes nothing in this slice.
# Override with the IMMICH_API_KEY environment variable (recommended).
api_key = "REPLACE-WITH-READ-SCOPED-KEY"

# Assets fetched per search page (Immich allows up to 1000).
page_size = 1000

# Per-request timeout in seconds.
timeout_seconds = 60

[store]
# Where the local store (checkpoint, embeddings, and later proposals) lives.
# Mount a volume here so the checkpoint survives container restarts.
path = "/data/reid.sqlite3"

[detection]
# Which Immich pixels feed the YOLO person detector.
#   preview  - the server-generated preview thumbnail (default; smaller
#              transfers, sufficient for detection at imgsz 640)
#   original - full-resolution originals (slower; only useful if previews
#              lose small/distant persons you care about)
pixel_source = "preview"

# YOLO detections below this confidence are dropped before embedding.
# Dropped counts are reported per run as "gate drops: low_confidence=N".
confidence_floor = 0.35

# Detections shorter than this many pixels (in the source image) are dropped;
# keeps far-away, barely-visible people out of the store.
# Dropped counts are reported per run as "below_min_height=N".
min_box_height = 100.0

[clustering]
# The timespan window: clusters are rebuilt from scratch within it every
# run, one window per block of consecutive calendar days. 1 = the same
# calendar day (default); 2 merges each pair of consecutive days, and so on.
window_days = 1

# Cosine distance threshold over the L2-normalized embeddings: appearances
# cluster together while their mean pairwise distance stays at or below
# this (agglomerative, average linkage). Initial default 0.5 - to
# calibrate against real data.
distance_threshold = 0.5

# Minimum number of appearances for an anchor-less cluster to enter the
# ask-for-name queue. Lone appearances (singletons) are never surfaced.
min_cluster_size = 2

# Face-to-appearance containment minimum: an Immich face detection claims
# an appearance when intersection / face-box-area reaches this ratio
# (best match wins if several faces qualify).
face_overlap = 0.5

[run]
# debug | info | warning | error
log_level = "info"

[core]
# The core API server (reid-core) is the single owner of the store; the UI
# (reid-ui) serves the browser assets and proxies /api/* to it.
url = "http://127.0.0.1:8090"

# Address reid-core itself binds to. Loopback by default: the UI proxies
# /api/* and the nightly trigger reaches the core on the same machine. Set a
# non-loopback address (e.g. "0.0.0.0") only together with an api_key, and
# only if something else (a UI on another machine) needs to reach it.
host = "127.0.0.1"
port = 8090

# Token the UI (and the nightly trigger) must present. Leave empty for local
# development; on any shared network set it here or, better, export
# REID_CORE_API_KEY. The core can start pipeline runs, so treat it as a
# secret.
api_key = ""

# [ui] is only read by reid-ui, never by the core. immich_url is optional:
# when unset it defaults to [immich] base_url, so you only set it when the
# UI runs on another machine and the core's own base_url doesn't resolve
# there. Either way, a localhost/127.0.0.1 URL is automatically rewritten
# in the browser to the host the UI was opened from, so viewer links work
# over the LAN without extra config.
[ui]
# immich_url = "http://<pi>:2283"

# Resetting: `reid-wipe` erases all stored embeddings and resets the batch
# checkpoint so the next run reprocesses every asset from scratch. Run it
# only at a batch/configuration boundary (e.g. after changing detection
# settings) - never as part of a per-asset confirmation flow.
