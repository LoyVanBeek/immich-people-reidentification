[project]
name = "immich-person-reidentification"
version = "0.1.0"
description = "Person re-identification for Immich: detect, embed, cluster, and propose name assignments from a Pi 5 container."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "click>=8.1",
    "httpx>=0.28",
    # Detector: YOLO11n runtime (weights are vendored; see ADR 0002 for the
    # runtime choice). Needs no network at runtime — weights load locally.
    "ultralytics>=8.3",
    # Embedder: OSNet-AIN x1.0 runs on official PyTorch wheels (ADR 0001),
    # which ship aarch64 (Pi 5) and x86_64 builds for Python 3.13.
    "torch>=2.6",
    # Pixel decode and full-person crop resizing.
    "opencv-python>=4.10",
    "numpy>=1.26",
    "onnxruntime>=1.32.0",
]

[project.scripts]
reid-batch = "reid.cli:batch"
reid-wipe = "reid.wipe:main"
reid-ui = "reid.server:main"
reid-core = "reid.core:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pre-commit>=4.7.0",
    "pytest>=8.4",
    "ty>=0.0.104",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "reid"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.13"
disable_error_code = ["untyped-decorator", "no-any-return"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

# ultralytics and opencv-python ship incomplete or no type hints; skip
# following them so their internal typing cannot leak into strict checks.
# The vendored torchreid module is verbatim upstream code: never annotated.
[[tool.mypy.overrides]]
module = ["ultralytics.*", "cv2", "reid._vendor.*"]
ignore_missing_imports = true
follow_imports = "skip"
ignore_errors = true

# Third-party libs without stubs — ignore missing imports
[[tool.mypy.overrides]]
module = ["numpy", "torch", "onnxruntime", "httpx", "pytest", "click", "ultralytics", "cv2"]
ignore_missing_imports = true

[tool.ty]
baseline = "ty-baseline.txt"
