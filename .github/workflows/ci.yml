name: Build and Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & unit tests (fast, x86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --all-extras

      - name: Lint (ruff)
        run: uvx ruff check src tests

      - name: Format check (ruff)
        run: uvx ruff format --check src tests

      - name: Type check (mypy)
        run: uvx mypy src/reid --ignore-missing-imports

      - name: JS syntax check (node --check)
        run: |
          node --check src/reid/ui/app.js
          echo "app.js parses cleanly"

      - name: Installer dry-run (idempotency, no docker/systemd needed)
        run: |
          chmod +x scripts/install.sh scripts/install-systemd.sh
          bash -n scripts/install.sh
          bash -n scripts/install-systemd.sh
          # First dry-run: validate args, detect mode, print plan
          scripts/install.sh --dry-run --mode systemd > /tmp/install-run1.log
          # Second dry-run: must be a no-op (same exit code, same output)
          scripts/install.sh --dry-run --mode systemd > /tmp/install-run2.log
          diff /tmp/install-run1.log /tmp/install-run2.log
          echo "Installer dry-run is idempotent"

      - name: UI smoke tests (jsdom)
        run: |
          cd tests/ui
          npm ci --no-audit --no-fund
          node app.test.mjs

      - name: Unit tests
        run: uv run pytest tests -x -q --tb=short